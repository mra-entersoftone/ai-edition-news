<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EBS AI Edition · Coming soon!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --blue:#0A4CE0; --blue-ink:#062C8F; --blue-soft:#5C8DFF;
  --lime:#B4F03C; --white:#FFFFFF; --mist:rgba(255,255,255,.74);
  --display:"Commissioner","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--blue-ink);color:var(--white);font-family:var(--display);overflow:hidden;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;transform:translate(-50%,-50%);background:var(--blue);overflow:hidden;
  background-image:radial-gradient(1200px 800px at 85% 10%,rgba(92,141,255,.35),transparent 60%),radial-gradient(900px 700px at 0% 100%,rgba(6,44,143,.55),transparent 60%)}

/* circuit-board traces */
#traces{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#traces path{fill:none;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw var(--dt,1.8s) cubic-bezier(.6,.05,.25,1) var(--dd,0s) forwards}
#traces circle{fill:none;opacity:0;animation:fade .4s ease var(--dd,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* entrance animations */
.a{opacity:0;animation:var(--k,up) var(--t,.9s) cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.fade{--k:fade}.left{--k:left}.mask{--k:mask;--t:1.1s}
@keyframes up{from{opacity:0;transform:translateY(44px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes left{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes mask{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.ln{fill:none;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:drawp 1.6s cubic-bezier(.2,.8,.2,1) var(--d,0s) forwards}
@keyframes drawp{to{stroke-dashoffset:0}}

/* layout (same as the release story intro scene) */
.mark{position:absolute;left:137px;top:121px;width:115px;height:198px}
.mark path{fill:none;stroke:var(--lime);stroke-width:8}
.es1{position:absolute;left:175px;top:165px;width:250px}
.title{position:absolute;left:160px;top:400px}
.kicker{font-family:var(--mono);font-size:28px;letter-spacing:.18em;color:var(--mist);margin:0}
h1{margin:26px 0 0;font-size:220px;font-weight:800;letter-spacing:-.03em;line-height:1.02}
h1 .lime{color:var(--lime)}
.sub{margin:44px 0 0;font-size:44px;font-weight:300;color:var(--white)}
.sub b{font-weight:600;color:var(--lime)}
.art{position:absolute;right:120px;top:100px;width:420px;height:320px}
.art path{fill:none;stroke-width:7;stroke-linecap:round}

@media (prefers-reduced-motion:reduce){
  .a,.ln,#traces path,#traces circle{animation:none!important;opacity:1;stroke-dashoffset:0}
}
</style>
</head>
